    for (let i = 0; i < 3; i++) {
        let random = Math.floor(Math.random() * animals.length);
        let animal = animals[random];

        document.getElementById(places[i]).innerHTML =
            '<h3>' + animal[0] + '</h3>' +
            '<a href="' + animal[2] + '">' +
            '<img src="' + animal[1] + '" width="250">' +
            '</a>';

        animals.splice(random, 1);
    }
